<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10243f">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="author" content="{{ site.title | escape }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url | relative_url }}">
    <link rel="canonical" href="{{ site.url }}{{ page.url | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} — Feed" href="{{ '/feed.xml' | relative_url }}">
    <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Pavlos Aimoniotis, home">PA<span>.</span></a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open navigation">
          <span></span><span></span>
        </button>
        <nav class="primary-navigation" id="primary-navigation" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#about">About</a>
          <a href="{{ '/' | relative_url }}#research">Research</a>
          <a href="{{ '/' | relative_url }}#publications">Publications</a>
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
          <a class="nav-contact" href="mailto:pavlosaimoniotis@gmail.com">Contact <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main id="main-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <a class="footer-name" href="{{ '/' | relative_url }}">Pavlos Aimoniotis</a>
        <p>Computer architecture · Performance · Security</p>
        <p class="footer-meta">© {{ site.time | date: '%Y' }} Pavlos Aimoniotis</p>
      </div>
    </footer>
  </body>
</html>
